<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Unbounded";
        src: url("assets/fonts/unbounded-cyrillic.woff2") format("woff2");
        font-weight: 200 900;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Unbounded";
        src: url("assets/fonts/unbounded-latin.woff2") format("woff2");
        font-weight: 200 900;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212;
      }
      :root {
        --yellow: #ffe600;
        --green: #7cff4f;
        --ink: #0b0b0b;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        font-family: Inter, sans-serif;
        color: #fff;
      }
      .layer {
        position: absolute;
        inset: 0;
      }
      /* Three nested wrappers so cut punches, slow drift and shakes never fight over one transform. */
      #punch,
      #drift,
      #shake {
        position: absolute;
        inset: 0;
      }
      #base {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
      #shade {
        background: linear-gradient(
          rgba(0, 0, 0, 0.45) 0%,
          rgba(0, 0, 0, 0) 22%,
          rgba(0, 0, 0, 0) 55%,
          rgba(0, 0, 0, 0.55) 100%
        );
      }
      #flash {
        background: #fff;
        opacity: 0;
      }
      #endDim {
        background: rgba(5, 10, 5, 0.62);
        opacity: 0;
      }
      #progress {
        position: absolute;
        left: 0;
        top: 0;
        height: 10px;
        width: 1080px;
        background: var(--yellow);
        transform-origin: 0 50%;
        box-shadow: 0 0 18px rgba(255, 230, 0, 0.8);
      }

      /* Captions */
      .cap {
        position: absolute;
        left: 70px;
        right: 150px;
        top: 1130px;
        text-align: center;
        opacity: 0;
        font-weight: 900;
        font-size: 64px;
        line-height: 1.12;
        text-shadow: 0 4px 0 rgba(0, 0, 0, 0.55), 0 0 30px rgba(0, 0, 0, 0.6);
        -webkit-text-stroke: 10px #000;
        paint-order: stroke fill;
      }
      .cap mark {
        -webkit-text-stroke: 0;
        background: var(--yellow);
        color: var(--ink);
        padding: 0 12px;
        border-radius: 10px;
        text-shadow: none;
        box-decoration-break: clone;
        -webkit-box-decoration-break: clone;
      }
      .cap .g {
        color: var(--green);
      }
      .cap.hook {
        top: 560px;
        left: 40px;
        right: 40px;
        font-family: Unbounded, sans-serif;
        font-size: 104px;
        line-height: 1.05;
        letter-spacing: -2px;
      }
      .cap.big {
        top: 760px;
        left: 40px;
        right: 40px;
        font-family: Unbounded, sans-serif;
        font-size: 100px;
        letter-spacing: -2px;
      }
      .cap.top {
        top: 300px;
      }

      /* Title card */
      #title {
        position: absolute;
        left: 0;
        right: 0;
        top: 420px;
        text-align: center;
        font-family: Unbounded, sans-serif;
        font-weight: 900;
        opacity: 0;
      }
      #title .row {
        display: block;
        font-size: 200px;
        line-height: 1.04;
        letter-spacing: -6px;
        text-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      }
      #title .row span {
        display: inline-block;
      }
      #title .year {
        display: inline-block;
        margin-top: 30px;
        padding: 6px 34px 14px;
        background: var(--green);
        color: var(--ink);
        font-size: 150px;
        border-radius: 22px;
        letter-spacing: -4px;
      }
      #title .sub {
        display: inline-block;
        margin-top: 36px;
        padding: 16px 34px;
        background: rgba(0, 0, 0, 0.7);
        border: 3px solid var(--yellow);
        border-radius: 60px;
        font-family: Inter, sans-serif;
        font-size: 52px;
        font-weight: 800;
        letter-spacing: 0;
      }

      /* Location pin */
      #pin {
        position: absolute;
        left: 70px;
        top: 330px;
        display: flex;
        align-items: center;
        gap: 22px;
        padding: 22px 36px 22px 24px;
        background: #fff;
        color: var(--ink);
        border-radius: 28px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
        opacity: 0;
      }
      #pin .ico {
        width: 84px;
        height: 84px;
        border-radius: 22px;
        background: #ff3b30;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 50px;
      }
      #pin .t1 {
        font-size: 50px;
        font-weight: 900;
      }
      #pin .t2 {
        font-size: 36px;
        font-weight: 600;
        color: #555;
      }

      /* Chapter stickers */
      .chapter {
        position: absolute;
        left: 0;
        right: 0;
        top: 700px;
        text-align: center;
        opacity: 0;
      }
      .chapter .num {
        display: inline-block;
        font-family: Unbounded, sans-serif;
        font-weight: 900;
        font-size: 70px;
        color: var(--ink);
        background: var(--yellow);
        padding: 4px 26px 10px;
        border-radius: 16px;
        transform: rotate(-4deg);
      }
      .chapter .name {
        display: block;
        margin-top: 18px;
        font-family: Unbounded, sans-serif;
        font-weight: 900;
        font-size: 130px;
        letter-spacing: -3px;
        line-height: 1;
        text-shadow: 0 8px 0 rgba(0, 0, 0, 0.5), 0 0 40px rgba(0, 0, 0, 0.6);
      }
      /* Persistent chapter tag in the corner */
      .tag {
        position: absolute;
        left: 60px;
        top: 150px;
        padding: 12px 24px;
        border-radius: 14px;
        background: rgba(0, 0, 0, 0.6);
        border: 2px solid rgba(255, 255, 255, 0.25);
        font-size: 36px;
        font-weight: 800;
        opacity: 0;
      }
      .tag b {
        color: var(--yellow);
      }

      /* End card */
      #end {
        position: absolute;
        left: 60px;
        right: 60px;
        top: 360px;
        text-align: center;
        opacity: 0;
      }
      #end .logo {
        font-family: Unbounded, sans-serif;
        font-weight: 900;
        font-size: 64px;
        letter-spacing: -1px;
      }
      #end .logo i {
        font-style: normal;
        color: var(--green);
      }
      #end .q {
        margin-top: 70px;
        font-family: Unbounded, sans-serif;
        font-weight: 900;
        font-size: 92px;
        line-height: 1.05;
        letter-spacing: -2px;
      }
      #end .q mark {
        background: var(--yellow);
        color: var(--ink);
        padding: 0 14px;
        border-radius: 14px;
      }
      #end .hint {
        margin-top: 40px;
        font-size: 50px;
        font-weight: 700;
        color: #ddd;
      }
      #end .btns {
        margin-top: 90px;
        display: flex;
        justify-content: center;
        gap: 30px;
      }
      #end .btn {
        padding: 30px 46px;
        border-radius: 70px;
        font-size: 50px;
        font-weight: 900;
        background: #fff;
        color: var(--ink);
      }
      #end .btn.alt {
        background: var(--yellow);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="57.533"
      data-width="1080"
      data-height="1920"
    >
      <div id="punch">
        <div id="drift">
          <div id="shake">
            <video
              id="base"
              class="clip"
              src="assets/base.mp4"
              data-start="0"
              data-duration="57.533"
              data-track-index="0"
              muted
              playsinline
            ></video>
          </div>
        </div>
      </div>
      <audio id="music" src="assets/music.wav" data-start="0" data-duration="57.533" data-track-index="1"></audio>

      <div id="shade" class="layer"></div>
      <div id="endDim" class="layer"></div>
      <div id="captions" class="layer"></div>

      <div id="title">
        <span class="row" id="r1"></span>
        <span class="row" id="r2"></span>
        <span class="row" id="r3"></span>
        <span class="year">2026</span><br />
        <span class="sub">глазами посетителя 👀</span>
      </div>

      <div id="pin">
        <div class="ico">📍</div>
        <div>
          <div class="t1">Москва</div>
          <div class="t2">28.09 – 01.10 · выставка</div>
        </div>
      </div>

      <div id="chapters" class="layer"></div>

      <div id="end">
        <div class="logo">АГРОПРОДМАШ <i>2026</i></div>
        <div class="q">А тебя что <mark>удивило</mark> больше всего?</div>
        <div class="hint">роботы, тесто или мясорубки?<br />пиши в комментах 👇</div>
        <div class="btns">
          <div class="btn" id="b1">🔖 Сохрани</div>
          <div class="btn alt" id="b2">➕ Подпишись</div>
        </div>
      </div>

      <div id="flash" class="layer"></div>
      <div id="progress"></div>
    </div>

    <script>
      const BEAT = 60 / 128;
      const T = (b) => b * BEAT;
      const DURATION = 57.533;
      const tl = gsap.timeline({ paused: true });
      // Many tweens hit the same properties (#punch, #flash); deferring each start value keeps seeking exact.
      const ft = (target, from, to, at) => tl.fromTo(target, from, { ...to, immediateRender: false }, at);

      // Shot boundaries in beats — must match EDL in tools/cut.py.
      const SHOT_BEATS = [2, 2, 2, 2, 2, 2, 4, 4, 2, 2, 4, 2, 2, 3, 4, 3, 2, 2, 2, 2, 2, 2, 2, 3, 3, 2, 2, 2, 2, 3, 3, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 4, 2, 2, 2, 4, 4, 6];
      const cuts = [];
      SHOT_BEATS.reduce((b, n) => (cuts.push(b), b + n), 0);
      const CHAPTER_BEATS = [32, 56, 80, 96];
      const HOOK_END = 12;

      // ---------- Camera: punch-in on every cut, whip on chapter changes, slow drift inside shots ----------
      cuts.forEach((b, i) => {
        const t = T(b);
        if (CHAPTER_BEATS.includes(b)) {
          tl.to("#punch", { x: -140, filter: "blur(22px)", duration: 0.13, ease: "power2.in" }, t - 0.13);
          ft("#punch", { x: 160, scale: 1.18, filter: "blur(22px)" }, { x: 0, scale: 1, filter: "blur(0px)", duration: 0.38, ease: "power3.out" }, t);
          ft("#flash", { opacity: 0.85 }, { opacity: 0, duration: 0.3, ease: "power2.out" }, t);
          return;
        }
        if (b === 0) return;
        const from = b < HOOK_END ? 1.22 : 1.12;
        const origin = ["50% 40%", "35% 50%", "65% 55%", "50% 65%"][i % 4];
        ft("#punch", { scale: from, transformOrigin: origin }, { scale: 1, duration: 0.32, ease: "power3.out" }, t);
        if (b < HOOK_END) ft("#flash", { opacity: 0.55 }, { opacity: 0, duration: 0.18 }, t);
      });
      // Slow push-in across each shot keeps static footage alive.
      cuts.forEach((b, i) => {
        const len = T(SHOT_BEATS[i]);
        ft("#drift", { scale: 1 }, { scale: 1.06, duration: len, ease: "none" }, T(b));
      });
      // Bar-downbeat shakes through the drop.
      for (let b = 32; b < 96; b += 4) {
        ft("#shake", { x: 10, y: -8 }, { x: 0, y: 0, duration: 0.22, ease: "elastic.out(1, 0.4)" }, T(b));
      }
      // Hook: shake on every beat.
      for (let b = 0; b < HOOK_END; b++) {
        ft("#shake", { x: b % 2 ? 8 : -8, y: 6 }, { x: 0, y: 0, duration: 0.2, ease: "power2.out" }, T(b));
      }

      // ---------- Progress bar (retention cue) ----------
      tl.fromTo("#progress", { scaleX: 0 }, { scaleX: 1, duration: DURATION, ease: "none" }, 0);

      // ---------- Captions ----------
      // [startBeat, endBeat, html, style]
      const CAPS = [
        [0, 2, "ЭТО<br>НЕ ЗАВОД", "hook"],
        [2, 4, "И НЕ<br>ФИЛЬМ", "hook"],
        [4, 6, "ЭТО<br><mark>ВЫСТАВКА</mark>", "hook"],
        [6, 12, "где делают<br>машины для <span class='g'>еды</span> 🍞", "hook"],
        [16, 18, "<mark>POV:</mark> поехал смотреть,", ""],
        [18, 20, "на чём делают<br>нашу еду 🍞", ""],
        [22, 24, "ЗАХОДИМ →", "big"],
        [24, 28, "тут <mark>огромно</mark> 😳", ""],
        [28, 30, "куда идти первым?", ""],
        [30, 32, "конечно, к <mark>роботам</mark> 🤖", ""],
        [35, 39, "робот сам<br>таскает <mark>коробки</mark> 📦", ""],
        [39, 42, "а тут их<br>целая <mark>бригада</mark>", ""],
        [44, 46, "конфеты? тоже<br><mark>робот</mark> 🍬", ""],
        [46, 48, "человеку осталось<br>подать коробку 😅", ""],
        [50, 54, "сколько тут<br><mark>роботов?!</mark> 🤯", ""],
        [59, 62, "тесто льётся<br><mark>рекой</mark> 🤤", ""],
        [62, 64, "кондитерка<br>на потоке 🍫", ""],
        [64, 68, "полуфабрикаты —<br>тоже на <mark>автомате</mark>", ""],
        [70, 73, "овощи → <mark>в душ</mark> 🚿", ""],
        [73, 76, "моет быстрее<br>любой посудомойки", ""],
        [76, 80, "мясорубки размером<br>с <mark>холодильник</mark> 🥩", ""],
        [80, 82, "рулон плёнки…", ""],
        [82, 84, "…и вот уже<br><mark>упаковка</mark> ✨", ""],
        [86, 90, "линии длиной<br>в целый <mark>стенд</mark>", ""],
        [92, 94, "а тут решают<br><mark>дела</mark> 🤝", ""],
        [94, 96, "даже санпропускник —<br>автомат 🧼", ""],
        [96, 100, "деловая программа:<br>зал <mark>битком</mark>", ""],
        [100, 104, "лекции, стенды,<br>переговоры", ""],
        [106, 108, "ИТОГ:", "big"],
        [108, 110, "еду всё чаще<br>делают <mark>роботы</mark> 🤖", ""],
        [110, 114, "и это<br>только начало", ""],
      ];
      const capLayer = document.getElementById("captions");
      CAPS.forEach(([b0, b1, html, style], i) => {
        const el = document.createElement("div");
        el.className = "cap " + style;
        el.innerHTML = html;
        capLayer.appendChild(el);
        const t0 = T(b0);
        const t1 = T(b1);
        ft(el, { opacity: 0, scale: 0.55, y: 50, rotation: i % 2 ? 3 : -3 }, { opacity: 1, scale: 1, y: 0, rotation: 0, duration: 0.24, ease: "back.out(2.6)" }, t0);
        const mark = el.querySelector("mark");
        if (mark) ft(mark, { scale: 1 }, { scale: 1.12, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out" }, t0 + BEAT);
        tl.to(el, { opacity: 0, scale: 0.9, y: -20, duration: 0.1, ease: "power2.in" }, t1 - 0.1);
      });

      // ---------- Title card (banner shot, beats 12-16) ----------
      const rows = { r1: "АГРО", r2: "ПРОД", r3: "МАШ" };
      Object.entries(rows).forEach(([id, word]) => {
        document.getElementById(id).innerHTML = [...word].map((c) => `<span>${c}</span>`).join("");
      });
      const tT = T(HOOK_END);
      tl.set("#title", { opacity: 1 }, tT);
      tl.from("#title .row span", { y: 160, opacity: 0, rotation: 8, duration: 0.35, ease: "back.out(2)", stagger: 0.04 }, tT);
      tl.from("#title .year", { scale: 3, opacity: 0, rotation: -12, duration: 0.3, ease: "power4.out" }, tT + 0.75);
      ft("#flash", { opacity: 0.6 }, { opacity: 0, duration: 0.25 }, tT + 0.75);
      tl.from("#title .sub", { y: 60, opacity: 0, duration: 0.3, ease: "back.out(2)" }, tT + 1.05);
      tl.to("#title", { opacity: 0, scale: 1.15, duration: 0.15, ease: "power2.in" }, T(16) - 0.15);

      // ---------- Location pin (beats 20-24) ----------
      ft("#pin", { opacity: 0, x: -400 }, { opacity: 1, x: 0, duration: 0.35, ease: "back.out(1.8)" }, T(20));
      ft("#pin .ico", { rotation: -25, scale: 0.6 }, { rotation: 0, scale: 1, duration: 0.5, ease: "elastic.out(1, 0.4)" }, T(20) + 0.1);
      tl.to("#pin", { opacity: 0, x: -400, duration: 0.2, ease: "power2.in" }, T(24) - 0.2);

      // ---------- Chapters ----------
      const CHAPTERS = [
        [32, "01", "РОБОТЫ", 56],
        [56, "02", "ЕДА", 80],
        [80, "03", "УПАКОВКА", 96],
        [96, "04", "ЛЮДИ", 106],
      ];
      const chLayer = document.getElementById("chapters");
      CHAPTERS.forEach(([b, num, name, until]) => {
        const card = document.createElement("div");
        card.className = "chapter";
        card.innerHTML = `<span class="num">${num}</span><span class="name">${name}</span>`;
        chLayer.appendChild(card);
        const tag = document.createElement("div");
        tag.className = "tag";
        tag.innerHTML = `<b>${num}</b> ${name}`;
        chLayer.appendChild(tag);
        const t = T(b);
        ft(card, { opacity: 0, scale: 2.2 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power4.out" }, t);
        ft(card.querySelector(".num"), { rotation: -30 }, { rotation: -4, duration: 0.5, ease: "elastic.out(1, 0.5)" }, t);
        tl.to(card, { opacity: 0, y: -80, duration: 0.15, ease: "power2.in" }, t + 3 * BEAT - 0.15);
        ft(tag, { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out" }, t + 3 * BEAT);
        tl.to(tag, { opacity: 0, duration: 0.12 }, T(until) - 0.12);
      });

      // ---------- End card (beat 114 to the end) ----------
      const tE = T(114);
      ft("#endDim", { opacity: 0 }, { opacity: 1, duration: 0.3 }, tE);
      ft("#punch", { filter: "blur(0px)" }, { filter: "blur(6px)", duration: 0.4 }, tE);
      ft("#flash", { opacity: 0.7 }, { opacity: 0, duration: 0.3 }, tE);
      tl.set("#end", { opacity: 1 }, tE);
      tl.from("#end .logo", { y: -60, opacity: 0, duration: 0.3, ease: "back.out(2)" }, tE);
      tl.from("#end .q", { scale: 0.5, opacity: 0, duration: 0.35, ease: "back.out(2.2)" }, tE + 0.25);
      tl.from("#end .hint", { y: 40, opacity: 0, duration: 0.3 }, tE + 0.7);
      tl.from("#end .btn", { y: 120, opacity: 0, duration: 0.4, ease: "back.out(2)", stagger: 0.15 }, tE + 1.0);
      // "Tap" pulses on the buttons.
      [["#b1", 2.2], ["#b2", 3.0]].forEach(([sel, dt]) => {
        tl.to(sel, { scale: 0.9, duration: 0.1, yoyo: true, repeat: 1, ease: "power2.inOut" }, tE + dt);
      });

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
