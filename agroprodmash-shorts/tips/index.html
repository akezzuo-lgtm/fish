<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/shots.js"></script>
    <style>
      @font-face {
        font-family: "Unbounded";
        src: url("assets/fonts/unbounded-cyrillic.woff2") format("woff2");
        font-weight: 200 900;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Unbounded";
        src: url("assets/fonts/unbounded-latin.woff2") format("woff2");
        font-weight: 200 900;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212;
      }
      :root {
        --yellow: #ffe600;
        --ink: #0b0b0b;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        font-family: Inter, sans-serif;
        color: #fff;
      }
      #punch,
      #drift {
        position: absolute;
        inset: 0;
      }
      #base {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
      #shade {
        position: absolute;
        inset: 0;
        background: linear-gradient(rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0.35) 38%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.4) 100%);
      }
      #flash {
        position: absolute;
        inset: 0;
        background: #fff;
        opacity: 0;
      }
      #progress {
        position: absolute;
        left: 0;
        top: 0;
        height: 10px;
        width: 1080px;
        background: var(--yellow);
        transform-origin: 0 50%;
      }
      .card {
        position: absolute;
        left: 60px;
        right: 60px;
        top: 260px;
        opacity: 0;
      }
      .num {
        display: inline-flex;
        align-items: baseline;
        gap: 6px;
        padding: 6px 26px 12px;
        border-radius: 18px;
        background: var(--yellow);
        color: var(--ink);
        font-family: Unbounded, sans-serif;
        font-weight: 900;
        font-size: 96px;
        transform: rotate(-4deg);
      }
      .num small {
        font-size: 44px;
        opacity: 0.6;
      }
      .tt {
        margin-top: 34px;
        font-family: Unbounded, sans-serif;
        font-weight: 900;
        font-size: 84px;
        line-height: 1.1;
        letter-spacing: -1px;
        text-shadow: 0 6px 30px rgba(0, 0, 0, 0.6);
      }
      .sub {
        display: inline-block;
        margin-top: 30px;
        padding: 18px 26px;
        border-radius: 20px;
        background: rgba(0, 0, 0, 0.6);
        font-size: 46px;
        font-weight: 700;
        line-height: 1.25;
      }
      #hook,
      #end {
        position: absolute;
        left: 60px;
        right: 60px;
        top: 420px;
        text-align: center;
        opacity: 0;
      }
      #hook .big,
      #end .big {
        font-family: Unbounded, sans-serif;
        font-weight: 900;
        font-size: 96px;
        line-height: 1.12;
        letter-spacing: -2px;
        text-shadow: 0 6px 30px rgba(0, 0, 0, 0.6);
      }
      mark {
        background: var(--yellow);
        color: var(--ink);
        padding: 0 14px;
        border-radius: 14px;
        text-shadow: none;
      }
      #hook .pill,
      #end .pill {
        display: inline-block;
        margin-top: 40px;
        padding: 18px 34px;
        border-radius: 60px;
        border: 3px solid var(--yellow);
        background: rgba(0, 0, 0, 0.65);
        font-size: 50px;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="32" data-width="1080" data-height="1920">
      <div id="punch">
        <div id="drift">
          <video id="base" class="clip" src="assets/base.mp4" data-start="0" data-duration="32" data-track-index="0" muted playsinline></video>
        </div>
      </div>
      <audio id="music" src="assets/music.wav" data-start="0" data-duration="32" data-track-index="1"></audio>
      <div id="shade"></div>
      <div id="hook">
        <div class="big">Как ходить<br />на выставку,<br /><mark>чтобы не зря</mark></div>
        <div class="pill">5 советов от посетителя 👇</div>
      </div>
      <div id="cards"></div>
      <div id="end">
        <div class="big"><mark>Сохрани</mark><br />перед следующей<br />выставкой 🔖</div>
        <div class="pill">а какой совет добавишь ты? 👇</div>
      </div>
      <div id="flash"></div>
      <div id="progress"></div>
    </div>
    <script>
      const TIPS = [
        ["Составь маршрут заранее", "здесь легко потерять полдня,<br />просто бродя между стендами"],
        ["Смотри машины в работе", "не по картинке в каталоге,<br />а вживую, на стенде"],
        ["Спрашивай цифры", "цена, сроки поставки, окупаемость —<br />менеджеры для этого и стоят"],
        ["Фоткай таблички и QR", "через неделю не вспомнишь,<br />кто и что показывал"],
        ["Зайди на деловую программу", "там говорят о рынке то,<br />чего нет на стендах"],
      ];
      const S = window.SHOTS;
      const DUR = window.DURATION;
      const TIP_SHOT = [1, 3, 5, 7, 9]; // first shot of each tip
      const END_SHOT = 11;
      const tl = gsap.timeline({ paused: true });
      const ft = (t, a, b, at) => tl.fromTo(t, a, { ...b, immediateRender: false }, at);

      tl.fromTo("#progress", { scaleX: 0 }, { scaleX: 1, duration: DUR, ease: "none" }, 0);
      S.forEach((s, i) => {
        ft("#drift", { scale: 1 }, { scale: 1.06, duration: s.len, ease: "none" }, s.start);
        if (i === 0) return;
        if (TIP_SHOT.includes(i) || i === END_SHOT) {
          // whip + flash into each new tip
          tl.to("#punch", { x: -140, filter: "blur(20px)", duration: 0.12, ease: "power2.in" }, s.start - 0.12);
          ft("#punch", { x: 160, scale: 1.15, filter: "blur(20px)" }, { x: 0, scale: 1, filter: "blur(0px)", duration: 0.35, ease: "power3.out" }, s.start);
          ft("#flash", { opacity: 0.8 }, { opacity: 0, duration: 0.28 }, s.start);
        } else {
          ft("#punch", { scale: 1.12 }, { scale: 1, duration: 0.3, ease: "power3.out" }, s.start);
        }
      });

      // Hook
      tl.set("#hook", { opacity: 1 }, 0);
      tl.from("#hook .big", { scale: 0.6, opacity: 0, duration: 0.35, ease: "back.out(2.2)" }, 0.05);
      tl.from("#hook .pill", { y: 50, opacity: 0, duration: 0.3, ease: "back.out(2)" }, 0.6);
      tl.to("#hook", { opacity: 0, duration: 0.12 }, S[1].start - 0.12);

      // Tips
      const cards = document.getElementById("cards");
      TIPS.forEach(([title, sub], k) => {
        const c = document.createElement("div");
        c.className = "card";
        c.innerHTML = `<span class="num">${k + 1}<small>/5</small></span><div class="tt">${title}</div><div class="sub">${sub}</div>`;
        cards.appendChild(c);
        const t0 = S[TIP_SHOT[k]].start;
        const t1 = TIP_SHOT[k + 1] !== undefined ? S[TIP_SHOT[k + 1]].start : S[END_SHOT].start;
        tl.set(c, { opacity: 1 }, t0);
        ft(c.querySelector(".num"), { scale: 0, rotation: -40 }, { scale: 1, rotation: -4, duration: 0.45, ease: "elastic.out(1, 0.5)" }, t0);
        ft(c.querySelector(".tt"), { x: -80, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, t0 + 0.12);
        ft(c.querySelector(".sub"), { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, t0 + 0.45);
        tl.to(c, { opacity: 0, duration: 0.1 }, t1 - 0.1);
      });

      // End card
      const tE = S[END_SHOT].start;
      tl.set("#end", { opacity: 1 }, tE);
      tl.from("#end .big", { scale: 0.6, opacity: 0, duration: 0.35, ease: "back.out(2.2)" }, tE + 0.05);
      tl.from("#end .pill", { y: 50, opacity: 0, duration: 0.3, ease: "back.out(2)" }, tE + 0.7);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
