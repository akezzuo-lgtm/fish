<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/shots.js"></script>
    <script src="assets/vo_words.js"></script>
    <style>
      @font-face {
        font-family: "Unbounded";
        src: url("assets/fonts/unbounded-cyrillic.woff2") format("woff2");
        font-weight: 200 900;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Unbounded";
        src: url("assets/fonts/unbounded-latin.woff2") format("woff2");
        font-weight: 200 900;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212;
      }
      :root {
        --yellow: #ffe600;
        --green: #7cff4f;
        --ink: #0b0b0b;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        font-family: Inter, sans-serif;
        color: #fff;
      }
      #punch,
      #drift,
      #shake {
        position: absolute;
        inset: 0;
      }
      #base {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
      .layer {
        position: absolute;
        inset: 0;
      }
      #shade {
        background: radial-gradient(ellipse at 50% 45%, rgba(0, 0, 0, 0) 40%, rgba(0, 0, 0, 0.55) 100%);
      }
      #flash {
        background: #fff;
        opacity: 0;
      }
      #dim {
        background: rgba(0, 0, 0, 0.62);
        opacity: 0;
      }
      /* Letterbox bars for the trailer feel. */
      .bar {
        position: absolute;
        left: 0;
        right: 0;
        height: 120px;
        background: #000;
      }
      #barTop {
        top: 0;
      }
      #barBot {
        bottom: 0;
      }
      .sub {
        position: absolute;
        left: 60px;
        right: 60px;
        text-align: center;
        opacity: 0;
        font-weight: 900;
        -webkit-text-stroke: 10px #000;
        paint-order: stroke fill;
        text-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
      }
      .sub .wd {
        display: inline-block;
        margin: 0 8px;
      }
      #sub1 {
        top: 620px;
        font-family: Unbounded, sans-serif;
        font-size: 92px;
        line-height: 1.2;
        letter-spacing: -1px;
      }
      #sub2 {
        top: 1180px;
        font-size: 66px;
        line-height: 1.25;
      }
      .stamp {
        position: absolute;
        left: 0;
        right: 0;
        top: 820px;
        text-align: center;
        font-family: Unbounded, sans-serif;
        font-weight: 900;
        font-size: 122px;
        letter-spacing: -4px;
        color: #fff;
        -webkit-text-stroke: 12px #000;
        paint-order: stroke fill;
        opacity: 0;
      }
      .stamp.fill {
        color: var(--yellow);
      }
      #title {
        position: absolute;
        left: 0;
        right: 0;
        top: 480px;
        text-align: center;
        font-family: Unbounded, sans-serif;
        font-weight: 900;
        opacity: 0;
      }
      #title .row {
        display: block;
        font-size: 200px;
        line-height: 1.04;
        letter-spacing: -6px;
        -webkit-text-stroke: 14px #000;
        paint-order: stroke fill;
        text-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      }
      #title .row span {
        display: inline-block;
      }
      #title .year {
        display: inline-block;
        margin-top: 30px;
        padding: 6px 34px 14px;
        background: var(--green);
        color: var(--ink);
        font-size: 150px;
        border-radius: 22px;
        letter-spacing: -4px;
      }
      #end {
        position: absolute;
        left: 60px;
        right: 60px;
        top: 560px;
        text-align: center;
        opacity: 0;
      }
      #end .t1 {
        font-family: Unbounded, sans-serif;
        font-weight: 900;
        font-size: 92px;
        letter-spacing: -2px;
      }
      #end .date {
        display: inline-block;
        margin-top: 30px;
        padding: 10px 40px 20px;
        border-radius: 24px;
        background: var(--yellow);
        color: var(--ink);
        font-family: Unbounded, sans-serif;
        font-weight: 900;
        font-size: 116px;
        letter-spacing: -3px;
        white-space: nowrap;
        transform: rotate(-3deg);
      }
      #end .sub2 {
        margin-top: 70px;
        white-space: nowrap;
        font-size: 46px;
        font-weight: 800;
      }
      #bell {
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12.7" data-width="1080" data-height="1920">
      <div id="punch">
        <div id="drift">
          <div id="shake">
            <video id="base" class="clip" src="assets/base.mp4" data-start="0" data-duration="12.7" data-track-index="0" muted playsinline></video>
          </div>
        </div>
      </div>
      <audio id="sound" src="assets/mix.wav" data-start="0" data-duration="12.7" data-track-index="1"></audio>
      <div id="shade" class="layer"></div>
      <div id="dim" class="layer"></div>
      <div id="sub1" class="sub"></div>
      <div id="sub2" class="sub"></div>
      <div id="stamps" class="layer"></div>
      <div id="title">
        <span class="row" id="r1"></span>
        <span class="row" id="r2"></span>
        <span class="row" id="r3"></span>
        <span class="year">2026</span>
      </div>
      <div id="end">
        <div class="t1">Полное видео</div>
        <div class="date">5 октября</div>
        <div class="sub2">подпишись, чтобы не пропустить <span id="bell">🔔</span></div>
      </div>
      <div id="barTop" class="bar"></div>
      <div id="barBot" class="bar"></div>
      <div id="flash" class="layer"></div>
    </div>
    <script>
      const S = window.SHOTS;
      const W = window.VO_WORDS;
      const tl = gsap.timeline({ paused: true });
      const ft = (t, a, b, at) => tl.fromTo(t, a, { ...b, immediateRender: false }, at);
      const BIG = [1, 7, 10]; // shot indexes that land on a big impact

      // Camera: punch on every cut, extra flash + shake on the big hits, slow push inside shots.
      S.forEach((s, i) => {
        ft("#drift", { scale: 1 }, { scale: 1.07, duration: s.len, ease: "none" }, s.start);
        if (i === 0) return;
        const big = [2, 7, 10].includes(i);
        ft("#punch", { scale: big ? 1.25 : 1.14 }, { scale: 1, duration: big ? 0.45 : 0.28, ease: "power3.out" }, s.start);
        if (big) {
          ft("#flash", { opacity: 0.9 }, { opacity: 0, duration: 0.3 }, s.start);
          ft("#shake", { x: 18, y: -12 }, { x: 0, y: 0, duration: 0.4, ease: "elastic.out(1, 0.35)" }, s.start);
        }
      });
      // Whip into the title.
      tl.to("#punch", { filter: "blur(18px)", x: -120, duration: 0.15, ease: "power2.in" }, S[10].start - 0.15);
      ft("#punch", { filter: "blur(18px)", x: 140 }, { filter: "blur(0px)", x: 0, duration: 0.35, ease: "power3.out" }, S[10].start);

      // Karaoke subtitles for the two voice lines.
      function karaoke(sel, words, upper, until) {
        const el = document.querySelector(sel);
        el.innerHTML = words.map((w) => `<span class="wd">${upper ? w.w.toUpperCase() : w.w.replace("счета", "счёта")}</span>`).join(" ");
        ft(el, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.15, ease: "back.out(2.5)" }, words[0].t - 0.05);
        el.querySelectorAll(".wd").forEach((sp, k) => {
          ft(sp, { color: "#ffffff", opacity: 0.35 }, { color: "#ffe600", opacity: 1, duration: 0.06 }, words[k].t);
          if (k + 1 < words.length) tl.to(sp, { color: "#ffffff", duration: 0.06 }, words[k + 1].t);
        });
        tl.to(el, { opacity: 0, duration: 0.1 }, until);
      }
      karaoke("#sub1", W.filter((w) => w.t < 3), true, S[2].start - 0.02);
      karaoke("#sub2", W.filter((w) => w.t > 3), false, S[9].start + 0.35);

      // Stamped words over the flash montage.
      const STAMPS = [[2, "РОБОТЫ", true], [3, "МАШИНЫ", false], [4, "ОВОЩИ", false], [5, "УПАКОВКА", false], [6, "КОНВЕЙЕРЫ", true]];
      STAMPS.forEach(([i, word, fill]) => {
        const el = document.createElement("div");
        el.className = "stamp" + (fill ? " fill" : "");
        el.textContent = word;
        document.getElementById("stamps").appendChild(el);
        ft(el, { opacity: 1, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power4.out" }, S[i].start);
        tl.set(el, { opacity: 0 }, S[i].start + S[i].len - 0.02);
      });

      // Title card.
      const rows = { r1: "АГРО", r2: "ПРОД", r3: "МАШ" };
      Object.entries(rows).forEach(([id, word]) => {
        document.getElementById(id).innerHTML = [...word].map((c) => `<span>${c}</span>`).join("");
      });
      const tT = S[10].start;
      tl.set("#title", { opacity: 1 }, tT);
      tl.from("#title .row span", { y: 180, opacity: 0, rotation: 10, duration: 0.3, ease: "back.out(2)", stagger: 0.03 }, tT);
      tl.from("#title .year", { scale: 3, opacity: 0, rotation: -14, duration: 0.3, ease: "power4.out" }, tT + 0.55);
      ft("#flash", { opacity: 0.6 }, { opacity: 0, duration: 0.25 }, tT + 0.55);
      tl.to("#title", { opacity: 0, scale: 1.1, duration: 0.15 }, S[11].start - 0.15);

      // End card.
      const tE = S[11].start;
      ft("#dim", { opacity: 0 }, { opacity: 1, duration: 0.3 }, tE);
      ft("#punch", { filter: "blur(0px)" }, { filter: "blur(8px)", duration: 0.4 }, tE);
      tl.set("#end", { opacity: 1 }, tE);
      tl.from("#end .t1", { y: -60, opacity: 0, duration: 0.3, ease: "back.out(2)" }, tE + 0.05);
      tl.from("#end .date", { scale: 2.5, opacity: 0, rotation: -15, duration: 0.35, ease: "power4.out" }, tE + 0.3);
      tl.from("#end .sub2", { y: 50, opacity: 0, duration: 0.3 }, tE + 0.75);
      tl.to("#bell", { rotation: 20, duration: 0.08, yoyo: true, repeat: 7, ease: "sine.inOut", transformOrigin: "50% 0%" }, 10.6);
      // Letterbox opens up for the end card.
      tl.to("#barTop", { y: -120, duration: 0.4, ease: "power2.inOut" }, tE);
      tl.to("#barBot", { y: 120, duration: 0.4, ease: "power2.inOut" }, tE);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
